title: BSU Theme
author: Анатолий Афоненко
version: 0.2.0
quarto-required: ">=1.10.0"
# Asset-only extension: configuration is explicit in the consuming project.
# There are deliberately no custom formats, filters, or grading contracts.
contributes:
  metadata:
    # This descriptor makes the asset bundle installable without changing the
    # consuming project's format, brand, hooks, or content automatically.
    bsu-theme:
      brand: _brand.yml
      styles:
        common: styles/common.scss
        html: styles/book.scss
        revealjs: styles/slides.scss
