name: Native book publication writer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.10.18", "1.11.5"]
        profile: [student, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 9a4bf6aafd73aff0daf51ae208247f3f194057c2
          path: .book-qrc-provider
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: "v0.17.1"
      - name: Install native PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex lmodern texlive-fonts-recommended
      - name: Current production type graph and writer path contracts
        run: |
          quarto run tests/navigation-typecheck.ts
          quarto run tests/publication-address-writer-contracts.ts
      - name: Genuine multi-input book and sibling PDF publication
        env:
          REFERENCE_CATALOG_REPO: ${{ github.workspace }}/.book-qrc-provider
          OWNER_PUBLICATION_TEST_OUTPUT: ${{ runner.temp }}/book-writer
        run: quarto run tests/owner-publication-addresses.ts book-writer ${{ matrix.profile }}
      - name: Save native writer proof and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-writer-${{ matrix.quarto }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/book-writer
          include-hidden-files: true
          if-no-files-found: error
