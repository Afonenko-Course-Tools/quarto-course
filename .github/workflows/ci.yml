name: Проверка Core 9.4.0 (Quarto >=1.11.5 / TypeScript)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      QUARTO_PYTHON: /usr/bin/python3
      COURSE_PERFORMANCE_SOURCE: ${{ github.workspace }}/core/dependencies/performance
    defaults:
      run:
        working-directory: core
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: core
          submodules: true
      - name: Настроить HTTPS зеркало Ubuntu
        run: |
          test -f /etc/apt/apt-mirrors.txt
          test ! -L /etc/apt/apt-mirrors.txt
          grep -Rq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.10.0"
      - name: Подготовить зависимости Node
        run: npm ci
      - name: Подготовить доступный кеш инструментов
        run: |
          tool_cache="$RUNNER_TEMP/codex-tools"
          mkdir -p "$tool_cache"
          printf 'XDG_CACHE_HOME=%s\n' "$tool_cache" >> "$GITHUB_ENV"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - name: Блокирующий typed ESLint и границы модулей
        run: |
          npm run check-quality
          npm run check-quality:controls
      - name: Версии инструментов
        run: |
          quarto --version
      - name: Подготовить shell и Lua инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck fish shfmt yamllint luarocks pipx libxml2-utils
          sudo luarocks install luacheck
          pipx install ruff
          pipx install bandit
          cargo install stylua --locked --features lua54
          cargo install taplo-cli --locked
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          printf "%s\n" "$HOME/.cargo/bin" "$HOME/go/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash "$COURSE_PERFORMANCE_SOURCE/tools/setup-mv-ci.sh" "$RUNNER_TEMP/course-gnu-mv" >> "$GITHUB_PATH"
          bash "$COURSE_PERFORMANCE_SOURCE/tools/setup-lua-ci.sh" "$RUNNER_TEMP/core-luals"
          printf '%s\n' "$RUNNER_TEMP/core-luals/bin" >> "$GITHUB_PATH"
      - name: Строгие типы всего собственного кода и отрицательный Lua-контроль
        run: |
          npm run test:types:all
          quarto run tools/check-lua.ts --probe
          npm run check:static:controls
      - name: Native-проверки выпуска Java/SP без Print и Cloud
        timeout-minutes: 210
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/course-native-evidence"
          mkdir -p "$evidence"
          {
            printf 'source-commit='; git rev-parse HEAD
            printf 'source-tree='; git rev-parse 'HEAD^{tree}'
            printf 'extension-tree='; git rev-parse HEAD:_extensions
            printf 'tests-tree='; git rev-parse HEAD:tests
            printf 'performance-commit='; git -C "$COURSE_PERFORMANCE_SOURCE" rev-parse HEAD
            quarto --version
            } > "$evidence/source-toolchain.log"
          printf '%s\n' \
            'Состав: canonical --quick-after-types, весь early native slice, navigation-model.' \
            'Print/Cloud исключены поручением; browser PDF-проверки и их toolchain не запускаются.' \
            'Локальный npm test включает браузерную группу.' \
            > "$evidence/validation-scope.txt"
          bash tools/check-canonical.sh --quick-after-types "$evidence/canonical"
          bash tools/check-core-early-slice-ts.sh 2>&1 | tee "$evidence/early-native.log"
          npm run test:navigation-model 2>&1 | tee "$evidence/navigation-model.log"
      - name: Сохранить полные логи и progress native-проверок
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: >-
            core-native-${{ matrix.quarto }}-${{ github.run_id }}-${{ github.run_attempt }}-${{
            github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/course-native-evidence
          if-no-files-found: error
          retention-days: 14
