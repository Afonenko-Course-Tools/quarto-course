name: Check Quarto and CUE

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        quarto: [release, pre-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: latest
      - name: Tool versions
        run: |
          quarto --version
          cue version
      - name: Starter archives
        run: quarto run tests/archive.ts
      - name: Publication schema
        run: quarto run tests/publication.ts
      - name: Visibility in HTML and course model
        run: quarto run tests/visibility.ts
      - name: Rendered downloads
        run: quarto run tests/downloads.ts
      - name: Render example and check CUE rejection cases
        run: quarto run tests/example.ts
