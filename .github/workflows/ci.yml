name: Проверка Quarto и CUE

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        quarto: [release, pre-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: latest
      - name: Версии инструментов
        run: |
          quarto --version
          cue version
      - name: Единый словарь контракта
        run: node tools/sync-contract.mjs --check
      - name: Типы, канонический контракт и конечные цепочки фильтров
        run: |
          quarto run tests/navigation-typecheck.ts --main-ci
          node tests/canonical-contracts.mjs
          node tests/canonical-model.mjs
          node tests/canonical-body.mjs
          quarto run tests/owner-source-filters.ts
          quarto run tests/capture-marker.ts
          quarto run tests/adapter-service-files.ts
          quarto run tests/canonical-review-regressions.ts
      - name: Канонические задачи и обычные примеры
        run: |
          quarto run tests/canonical-core.ts
          quarto run tests/display-examples.ts
          quarto run tests/adapter-owner.ts cloud
          quarto run tests/adapter-owner.ts prairielearn
      - name: Видимость в HTML и модели курса
        run: quarto run tests/visibility.ts
      - name: Сборка примера и отклонение неверных моделей CUE
        run: quarto run tests/example.ts
      - name: Учебный контракт и профили
        run: quarto run tests/pedagogy.ts
      - name: Независимое включение расширений и единый контракт
        run: quarto run tests/core-activation.ts
      - name: Штатные форматы и настройки представления
        run: quarto run tests/presentation.ts
      - name: Зависимости браузерных проверок
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Модель навигации
        run: npm run test:navigation-model
      - name: Навигация, раскрытие блоков и содержимое PDF
        run: npm run test:browser
