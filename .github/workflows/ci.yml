name: Проверка Core 9.1.0 (Quarto >=1.11.5 / TypeScript)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      QUARTO_PYTHON: /usr/bin/python3
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5", "1.11.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Подготовить доступный кеш инструментов
        run: |
          tool_cache="$RUNNER_TEMP/codex-tools"
          mkdir -p "$tool_cache"
          printf 'XDG_CACHE_HOME=%s\n' "$tool_cache" >> "$GITHUB_ENV"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - name: Версии инструментов
        run: |
          quarto --version
      - name: Browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern r-base r-cran-knitr r-cran-rmarkdown jupyter-core python3-ipykernel python3-nbformat python3-nbclient python3-yaml
      - name: Получить точные публичные входы раннего среза
        timeout-minutes: 10
        run: |
          fixture_root="$RUNNER_TEMP/core-early-inputs"
          python3 tools/prepare-early-slice-inputs.py --root "$fixture_root"
          printf 'CORE_EARLY_FIXTURES=%s\n' "$fixture_root" >> "$GITHUB_ENV"
      - name: Complete native suite
        timeout-minutes: 210
        run: |
          evidence="$RUNNER_TEMP/course-native-evidence"
          mkdir -p "$evidence"
          {
            printf 'source-commit='; git rev-parse HEAD
            printf 'source-tree='; git rev-parse 'HEAD^{tree}'
            printf 'extension-tree='; git rev-parse HEAD:_extensions
            printf 'tests-tree='; git rev-parse HEAD:tests
            quarto --version
            } > "$evidence/source-toolchain.log"
          npm test -- "$evidence"
      - name: Сохранить полные логи и progress native-проверок
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-native-${{ matrix.quarto }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/course-native-evidence
          if-no-files-found: error
          retention-days: 14
