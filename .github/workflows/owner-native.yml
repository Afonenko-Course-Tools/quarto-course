name: Owner session and resource evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        quarto: ['1.10.18', '1.11.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: d78a533b14c38e3dd64dbfbd59e437a82e2752fd
          path: .owner-test-provider
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: 'v0.17.1'
      - name: Install native R dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-knitr r-cran-rmarkdown r-cran-jsonlite
      - name: Record versions and exact provider
        run: |
          quarto --version
          quarto pandoc --version
          cue version
          git -C .owner-test-provider rev-parse HEAD
          Rscript -e 'cat(R.version.string, "\n"); for (p in c("knitr", "rmarkdown", "jsonlite")) cat(p, as.character(packageVersion(p)), "\n")'
      - name: Require installed native owner session and three-filter chain
        env:
          PROJECT_DOWNLOAD_REPO: ${{ github.workspace }}/.owner-test-provider
        run: quarto run tests/owner-session.ts
      - name: Require resource policy and installed current plot bytes
        env:
          OWNER_RESOURCES_NATIVE: '1'
        run: quarto run tests/owner-resources.ts
      - name: Require native full projection
        env:
          OWNER_RESOURCES_NATIVE: '1'
          OWNER_RESOURCES_PROFILE: full
        run: quarto run tests/owner-resources.ts
      - name: Require resource gates before engine and after computation
        env:
          OWNER_RESOURCES_NATIVE: '1'
        run: |
          OWNER_RESOURCES_FAILURE=early quarto run tests/owner-resources.ts
          OWNER_RESOURCES_FAILURE=early-canonical quarto run tests/owner-resources.ts
          OWNER_RESOURCES_FAILURE=late quarto run tests/owner-resources.ts
          OWNER_RESOURCES_FAILURE=extra quarto run tests/owner-resources.ts
