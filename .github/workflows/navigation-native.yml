name: Native navigation and scoped publication resources

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        quarto: ['1.10.18', '1.11.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: d78a533b14c38e3dd64dbfbd59e437a82e2752fd
          path: .navigation-test-provider
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 9a4bf6aafd73aff0daf51ae208247f3f194057c2
          path: .navigation-qrc-provider
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: 'v0.17.1'
      - name: Install native PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex lmodern texlive-fonts-recommended
          kpsewhich lmodern.sty
          kpsewhich pzdr.tfm
      - name: Record native tools and exact providers
        run: |
          quarto --version
          quarto pandoc --version
          cue version
          xelatex --version
          git -C .navigation-test-provider rev-parse HEAD
          git -C .navigation-qrc-provider rev-parse HEAD
      - name: Require production navigation typecheck
        run: quarto run tests/navigation-typecheck.ts
      - name: Require collision authority code paths
        run: quarto run tests/capture-collision-authority.ts
      - name: Require navigation model behavior
        run: node --test tests/navigation-model.cjs
      - name: Require native root selection, scopes and HTML addresses
        run: quarto run tests/navigation-owner.ts
      - name: Require actual native Download ownership and source freeze
        env:
          PROJECT_DOWNLOAD_REPO: ${{ github.workspace }}/.navigation-test-provider
        run: quarto run tests/navigation-owner.ts --download-only
      - name: Require current HTML and Reveal publication resource receipts
        run: quarto run tests/navigation-publication.ts
      - name: Require actual native owner publication addresses and PDF targets
        env:
          REFERENCE_CATALOG_REPO: ${{ github.workspace }}/.navigation-qrc-provider
          OWNER_PUBLICATION_TEST_OUTPUT: ${{ github.workspace }}/.navigation-address-probe
        run: quarto run tests/owner-publication-addresses.ts all
      - name: Require private capture projections and first publication denial
        env:
          REFERENCE_CATALOG_REPO: ${{ github.workspace }}/.navigation-qrc-provider
          OWNER_PUBLICATION_TEST_OUTPUT: ${{ github.workspace }}/.navigation-capture-probe
        run: quarto run tests/owner-publication-addresses.ts capture-positive
      - name: Require current finite projection registry and collision boundaries
        env:
          OWNER_CAPTURE_CONTRACT_ROOT: ${{ github.workspace }}/.navigation-capture-probe/case-0
        run: quarto run tests/capture-projection-contracts.ts
